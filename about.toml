# cargo-about configuration (TASK-0348): generates THIRD-PARTY-LICENSES.txt,
# the notices file bundled in every release archive. Regenerate with
# `make notices`; the `security` CI job fails when the committed file is stale.

# The same list deny.toml allows. A crate offering a choice ("MIT OR
# Apache-2.0") is recorded under the first of these it offers.
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "Unlicense",
  "CC0-1.0",
  "Zlib",
  "Unicode-3.0",
]

# Every release target (release.yml's `assets` matrix), so one file covers all
# four archives whichever machine generates it. A crate only one target links
# is listed for all of them.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

# Build scripts and tests are not part of the binary. Procedural-macro crates
# (syn, quote, the *_derive crates) cannot be told apart from linked ones here
# and stay listed: naming a crate too many costs nothing. The Rust standard
# library is invisible to cargo-about; the template names it in fixed text.
#
# Four crates fall back to cargo-about's standard license text because their
# packages carry no text the scan finds: blake3 (Apache-2.0; its files have
# unusual names and hold the standard text) and objc2, objc2-encode and
# objc2-foundation (MIT; they ship no license file at all).
ignore-build-dependencies = true
ignore-dev-dependencies = true

# chrono ships both of its licenses in one LICENSE.txt, which the scan does
# not split; cargo-about carries a built-in fix for it.
workarounds = ["chrono"]

# imgdedup itself (publish = false) is not a third party and is left out.
private = { ignore = true }

# The windows* crates ship their MIT text as `license-mit`, a name the scan
# does not look for, so each is pointed at it. The file is the same in all of
# them (one checksum). If a new version changes the text, generation fails
# on the checksum until this is updated.

[windows.clarify]
license = "MIT OR Apache-2.0"
[[windows.clarify.files]]
path = "license-mit"
license = "MIT"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"

