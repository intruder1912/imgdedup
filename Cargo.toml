[package]
name = "imgdedup"
version = "0.1.0"
edition = "2024"
description = "Find and remove duplicate images"
repository = "https://github.com/intruder1912/imgdedup"
# License decided GPL-3.0 (owner, 2026-07-19); SPDX id lands with the
# TASK-0202 licensing ADR. Not publishable until then.
license = "TBD"
publish = false

[[bin]]
name = "imgdedup"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.5"
clap = { version = "4", features = ["derive"] }
infer = "0.22"
rayon = "1"
same-file = "1.0.6"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
