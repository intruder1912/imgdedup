[package]
name = "imgdedup"
version = "0.1.0"
edition = "2024"
description = "Find and remove duplicate images"
repository = "https://github.com/intruder1912/imgdedup"
license = "MIT OR Apache-2.0"  # see LICENSE-MIT, LICENSE-APACHE and docs/adr/0020-relicense-mit-or-apache-2.0.md
# `version` above is a development placeholder: releases are tagged, not
# committed back (ADR-0015), so the released version lives in the git tag.
# Prebuilt release binaries get the real version stamped into this field
# transiently, in the CI runner's checkout only (TASK-0211,
# .github/workflows/release.yml) — this line never moves.
publish = false

[[bin]]
name = "imgdedup"
path = "src/main.rs"

[dependencies]
blake3 = { version = "1.8.5", features = ["rayon"] }
clap = { version = "4", features = ["derive"] }
infer = "0.22"
rayon = "1"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
trash = "5.2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
