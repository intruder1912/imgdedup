[package]
name = "imgdedup"
version = "0.1.0"
edition = "2024"
description = "Find and remove duplicate images"
repository = "https://github.com/intruder1912/imgdedup"
license = "GPL-3.0-only"  # see LICENSE and docs/adr/0014-project-license-gpl-3.0-only.md
# `version` above is a development placeholder: releases are tagged, not
# committed back (ADR-0015), so the released version lives in the git tag.
publish = false

[[bin]]
name = "imgdedup"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.5"
clap = { version = "4", features = ["derive"] }
infer = "0.22"
rayon = "1"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
trash = "5.2.6"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
