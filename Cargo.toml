[package]
name = "imgdedup"
version = "0.1.0"
edition = "2021"
description = "Find and remove duplicate images"
repository = "https://github.com/intruder1912/imgdedup"
license = "TBD"

[[bin]]
name = "imgdedup"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
infer = "0.16"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
