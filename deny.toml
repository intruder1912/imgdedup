# cargo-deny configuration (TASK-0208, ADR-0005 security gate).
# Checks: advisories (RUSTSEC db — supersedes a standalone cargo-audit),
# licenses, bans, sources. CI runs this when a dependency input changes and
# weekly (security.yml); locally: `make deny`, also part of `make validate`
# (requires cargo-deny: brew install cargo-deny, or
# cargo install cargo-deny --locked).

[graph]
all-features = true

[advisories]
# Vulnerability, unsound and unmaintained advisories are errors for every
# crate in the tree; yanked crates warn. The `unmaintained` and `unsound`
# scopes are set explicitly because cargo-deny narrowed their defaults to the
# workspace's direct dependencies (`unsound` in 0.19, `unmaintained` in
# 0.22): a tool bump must not quietly loosen the gate (#137).
unmaintained = "all"
unsound = "all"
# Every ignore names its reason and expires, so it is re-examined rather than
# forgotten: once the date passes, the advisory fails the audit again.
ignore = [
  # chrono comes in only through `trash`'s default `chrono` feature, which on
  # Linux writes the freedesktop `DeletionDate` into `.trashinfo`. Unmaintained
  # is not a vulnerability, and no patched chrono exists. Turning the feature
  # off would drop `DeletionDate`, which the spec requires. Before the expiry,
  # check whether `trash` has moved off chrono (#137).
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; only via trash's chrono feature; see #137", expiry = "2027-05-21" },
]

[licenses]
# Dependency licenses must be permissive: imgdedup itself is
# MIT OR Apache-2.0 (ADR-0020), and a copyleft dependency would put terms on
# the binary that the project's own license does not. Everything currently
# in the tree is permissive.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unlicense",
  "CC0-1.0",
  "Unicode-3.0",
]
# imgdedup itself is publish = false, so its own (MIT OR Apache-2.0) license is not
# checked against the allow-list above — that list governs dependencies.
private = { ignore = true }

[bans]
multiple-versions = "warn"
# Known duplicates, each with the reason it cannot be resolved here. A new
# duplicate still warns.
skip = [
  # serde_derive is on syn 3; clap_derive, tracing-attributes,
  # wasm-bindgen-macro-support and windows-implement are still on syn 2.
  # Drop once they move.
  { crate = "syn@2", reason = "ecosystem syn 2 -> 3 transition (serde_derive on syn 3)" },
]
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
