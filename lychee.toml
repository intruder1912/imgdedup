# lychee link-checker configuration (used by CI).
# Required gate since TASK-0206 (Phase 2): the CI job fails on broken links
# and `linkcheck` is a required status check on `main`. The retry/timeout/
# accept-code tuning below exists specifically to keep that gate from flaking
# on transient network errors now that it actually blocks merges.
#
# TASK-0206 finding: this file failed to *load* under the pinned lychee
# v0.24.2 (`exclude_mail` was removed from the config schema; mail links are
# excluded by default now) — a schema-drift bug identical in kind to the
# markdownlint-cli2 drift from Batch 0. Because the job ran with `fail: false`
# until this task, the load failure (exit code 3) was silently swallowed: link
# checking has never actually run in CI. Verified locally against the fixed
# config: 439 links, 438 OK, 0 errors, 1 excluded, 3 accepted redirects.

# Network behavior
max_retries = 3
timeout = 20
accept = [200, 206, 301, 302, 308, 429]

# The repository is private and not yet pushed publicly; skip self-references
# and common non-resolvable placeholders.
exclude = [
  "^https://github.com/intruder1912/imgdedup",
]

# Mail links are excluded by default (there's an `include_mail` opt-in for the
# opposite); nothing to configure here.
