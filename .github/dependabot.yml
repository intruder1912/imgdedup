version: 2
updates:
  # GitHub Actions used in workflows. The package ecosystem for the product
  # stack (e.g. cargo / npm / pip / gomod) is added in Phase 2 once chosen.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
