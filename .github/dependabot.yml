version: 2
updates:
  # GitHub Actions used in workflows (SHA-pinned; Dependabot updates the pins).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
  # Rust crate dependencies (stack chosen in ADR-0007; TASK-0209).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "rust"
    open-pull-requests-limit: 5
