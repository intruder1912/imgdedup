version: 2
updates:
  # GitHub Actions used in workflows (SHA-pinned; Dependabot updates the pins).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
  # Rust crate dependencies (stack chosen in ADR-0007; TASK-0209).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "rust"
    open-pull-requests-limit: 5
  # Release meta-tooling only (semantic-release; ADR-0015). Not the product
  # stack — package.json/package-lock.json exist solely to pin the release job's
  # dependency tree, which runs with `contents: write`.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "release-tooling"
    open-pull-requests-limit: 3
