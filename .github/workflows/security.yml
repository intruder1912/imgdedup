name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # Run the gitleaks CLI via its official image (no GitHub API integration,
      # so it works on a private personal repo under a least-privilege token).
      # Scans the full git history; non-zero exit = leaks found = job fails.
      - name: Scan for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --redact --no-banner --verbose

  # NOTE: GitHub's dependency-review-action requires GitHub Advanced Security,
  # which is unavailable on free private repositories. Dependency hygiene is
  # currently provided by Dependabot; a language-level dependency audit
  # (e.g. cargo audit / npm audit) is added with the stack in Phase 2
  # (TASK-0208 / TASK-0209). Re-enable dependency-review if GHAS becomes
  # available or the repository is made public.
