name: Release

# Releases — ADR-0015 (docs/adr/0015-release-publishing-tag-and-github-release.md),
# amended 2026-08-02 for TASK-0211 (prebuilt binaries) and 2026-08-05 for
# TASK-0333(b) (manual-only trigger).
#
# semantic-release computes the SemVer bump from the Conventional Commit history,
# creates the `v<version>` tag and the GitHub Release with generated notes.
# Nothing is committed back to `main`: the tag lives in `refs/tags/*` and branch
# protection targets `refs/heads/main`, so this needs no release bot, no PAT and
# no protection bypass — only the workflow's own GITHUB_TOKEN with
# `contents: write`. See docs/process/release.md for the operational procedure.
#
# A `GITHUB_TOKEN`-pushed tag triggers no other workflow (GitHub suppresses
# GITHUB_TOKEN-originated events other than workflow_dispatch/repository_dispatch
# to prevent recursion — ADR-0015), so the binaries cannot be built by a separate
# `on: push: tags:` workflow. The `assets` job below builds them in this same
# workflow run instead, gated on the `release` job detecting that a new tag was
# actually published.

on:
  # Manual only, by owner ruling (2026-08-05, TASK-0333(b)). This workflow used
  # to be triggered by every green CI run on `main`, i.e. every merge carrying a
  # `feat:`/`fix:` published a version: 12 releases in four days, and the four-
  # platform `assets` matrix below that each one starts cost 485 billed
  # Actions minutes over that window — 27% of the repository's entire bill — for
  # a private, single-maintainer project where nobody was waiting on any of
  # those versions. Nothing is lost by cutting releases deliberately instead:
  # semantic-release derives the next version from *all* Conventional Commits
  # since the last tag, so one dispatch releases everything accumulated since
  # the previous one, with the same version arithmetic.
  #
  # The trigger it replaces (`workflow_run` on the CI workflow completing,
  # filtered to a successful push-triggered run of `main`) had exactly one
  # load-bearing property: a release could never be published from a commit
  # whose checks were red or still running. That property is NOT dropped with
  # it. It moves, deliberately and explicitly, into the "Verify the required
  # checks are green" step below, which asks the checks API about the dispatched
  # commit and fails the job unless the answer is an unambiguous success — a
  # dispatcher's memory is not a security gate (ADR-0005). Making the check
  # explicit also closes ADR-0015's recorded gap of *not* gating on the
  # `Security` workflow: that gap existed only because `workflow_run` fires per
  # workflow and coordinating a second one would have meant polling its
  # status — which is precisely what this now does anyway.
  #
  # Two uses, distinguished by the `tag` input:
  #  1. Leave `tag` empty — the normal path: cut a release from the ref this
  #     workflow was dispatched against (which must be `main`, and must already
  #     have a green CI run recorded for it).
  #  2. Set `tag` to an existing `v*` tag: skip semantic-release entirely and
  #     (re-)build + attach binaries for that already-published release. This
  #     is the recovery path for a release whose assets job failed, and the
  #     one-time path used to backfill v0.1.0 (published before this workflow
  #     could build binaries). It asserts nothing about CI, on purpose: it
  #     repairs a release that already exists and was gated when it was cut,
  #     rather than deciding that anything should be released.
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing v* tag to (re-)build binaries for, e.g. v0.1.0. Leave empty
          for the normal path. Skips semantic-release — use only to backfill
          or recover assets for a release that already exists.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Never cancel a publishing run half-way through.
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    # No job-level `if:` any more. The previous one existed to sort a
    # `workflow_run` event into "CI went green on a push to this repository's
    # `main`" versus everything else (a red run, a still-running one, a fork
    # PR's run reporting its own default branch as `main`). With
    # `workflow_dispatch` as the only trigger none of those cases can occur:
    # a dispatch never originates from a fork and only a principal with write
    # access can start one. What remains — is this the right ref, and has it
    # actually passed CI — is now asserted by the first step below, which fails
    # loudly rather than skipping the job silently. A manual run that does
    # nothing and says nothing is the wrong answer to a human who just asked
    # for a release.
    runs-on: ubuntu-latest
    permissions:
      # Create the tag, the git notes ref and the GitHub Release. Nothing else:
      # the issue/PR comment features of @semantic-release/github (which would
      # need `issues: write` / `pull-requests: write`) are disabled in
      # .releaserc.json.
      contents: write
      # Read the check runs of the commit being released (TASK-0333(b)). This
      # is its own scope: `contents: write` does not imply it, and `checks:
      # read` is the narrowest permission that can read the checks API —
      # `actions: read` would also answer the question, via the workflow-runs
      # endpoint, but grants this job read access to every workflow run, its
      # logs and its artifacts, which it has no other use for.
      checks: read
    env:
      # The `tag` input, or '' when the dispatcher left it empty (the input
      # declares `default: ""`). Steps below gate on this variable rather than
      # on `github.event.inputs.tag` directly so that "input absent" and "input
      # supplied but empty" collapse into one plain string-to-string
      # comparison, and — the reason that matters — so this free-text input
      # reaches a shell only as an environment variable, never via `${{ }}`
      # interpolation into a `run:`.
      BACKFILL_TAG: ${{ github.event.inputs.tag }}
    outputs:
      released: ${{ steps.detect.outputs.released }}
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      # First, and before the checkout: this step is what makes a manual
      # release trigger safe (see the `on:` block above for what it replaces).
      # It needs no working tree, and everything after it is either an install
      # or a publish, so failing here costs a few seconds and touches nothing.
      #
      # Skipped on the backfill path, which repairs the assets of a release
      # that already exists rather than deciding to cut one — see use (2) in
      # the trigger comment.
      - name: Verify the required checks are green for the commit being released
        if: env.BACKFILL_TAG == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # The dispatched ref and the commit it resolved to when this run was
          # created. Both are GitHub-authored (a ref name and a 40-hex SHA),
          # but they reach the shell as environment variables anyway, per this
          # file's rule for every value that a `run:` block consumes.
          DISPATCH_REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # `main` is the only branch .releaserc.json will release from and the
          # only one ADR-0003 protects. semantic-release would refuse anything
          # else on its own, but only after ~400 packages are installed, and
          # with a message about release branches rather than about the mistake
          # actually made. This also restores the `head_branch == 'main'`
          # clause of the trigger this replaced.
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "::error::refusing to release from '$DISPATCH_REF' — releases are cut from refs/heads/main only"
            exit 1
          fi

          # Exactly the contexts `main`'s branch protection requires, minus
          # `checks`: `ci-gate` already aggregates it (it fails unless `checks`
          # succeeded and `rust` succeeded or was skipped), so naming both
          # would assert the same fact twice. `security` is aggregated by
          # nothing — it lives in a separate workflow — so it is named
          # explicitly, which is the ADR-0015 gap this step closes.
          contexts=(ci-gate security)

          failed=0
          for context in "${contexts[@]}"; do
            # `app_id` pins the answer to GitHub Actions (15368) — the same
            # pinning branch protection uses for these contexts — so a
            # same-named check run from any other integration holding
            # `checks: write` cannot satisfy this gate. (Verified against the
            # live API: a wrong `app_id` returns zero check runs rather than
            # being ignored.) The name match is exact and case-sensitive:
            # ci.yml suffixes a manually dispatched run's gate with ` (manual)`
            # precisely so it cannot stand in for a required context, and that
            # holds here too — only a real `push: main` run can answer.
            #
            # **Every returned check run must be green, not just one of them.**
            # `filter=latest` deduplicates *within a check suite* — it is what
            # makes a re-run supersede the attempt it re-ran — but GitHub
            # Actions creates one check suite per workflow *run*, so two
            # different runs reporting the same check name against the same
            # commit both come back. That is not hypothetical here: every
            # recent commit on `main` carries two or three `release` check runs
            # for exactly this reason, and `security.yml`'s weekly `schedule:`
            # run reports a second, unsuffixed `security` check run against
            # whatever `main`'s tip is at 06:23 on a Monday. Taking
            # `.check_runs[0]` would therefore have made the verdict depend on
            # an array order the REST API does not document — and the case it
            # decides is precisely the one this gate exists for: a new RUSTSEC
            # advisory found by the cron against an unchanged `Cargo.lock`,
            # sitting next to the push run's green `security`. Requiring all of
            # them is order-independent, strictly fail-closed, and still clears
            # by re-running the red run (a re-run lands in its own suite's
            # `latest`). It also means a hypothetical future `workflow_dispatch`
            # on `security.yml` could not launder a red result by adding a
            # green run beside it, the way ci.yml needs its ` (manual)` suffix
            # to prevent.
            result="$(gh api \
              "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=$context&filter=latest&app_id=15368" \
              --jq 'if (.check_runs | length) == 0 then "missing none"
                    else ([.check_runs[] | select(.status != "completed" or .conclusion != "success")]
                          | if length == 0 then "completed success"
                            else ((.[0].status // "unknown") + " " + (.[0].conclusion // "none")) end)
                    end')"
            status="${result% *}"
            conclusion="${result#* }"
            # Fail-closed on anything that is not a completed success:
            # "missing none" (CI never ran for this commit), "in_progress none"
            # (still running), and every non-success conclusion — failure,
            # cancelled, timed_out, action_required, skipped, neutral. A `gh
            # api` error exits here too, via `set -e` on the assignment above.
            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              echo "$context: success"
            else
              echo "::error::required check '$context' is not green for $HEAD_SHA (status=$status, conclusion=$conclusion)"
              failed=1
            fi
          done

          # Every context is reported before the step fails, for the same
          # reason ci.yml's `checks` job runs all of its steps: one dispatch
          # should surface every reason it was refused, not just the first.
          if [ "$failed" -ne 0 ]; then
            echo "::error::refusing to release $HEAD_SHA — wait for its checks to finish green (or re-run them), then dispatch this workflow again"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history *and all tags* — `fetch-depth: 0` makes checkout use
          # its all-history refspec, which includes `+refs/tags/*:refs/tags/*`
          # (it passes --no-tags otherwise). The bootstrap check, the tag-diff
          # detection, and the backfill tag lookup all depend on tags being
          # present.
          fetch-depth: 0
          # The dispatched commit — the same `github.sha` the step above just
          # proved has a green `ci-gate` and `security` — or (backfill) the tag
          # to rebuild. Checkout credentials are persisted (the default) on
          # purpose: semantic-release pushes the tag through this remote.
          ref: ${{ env.BACKFILL_TAG || github.sha }}

      - name: Check the version line is bootstrapped
        id: bootstrap
        if: env.BACKFILL_TAG == ''
        # With no `v*` tag present, semantic-release treats the whole history as
        # the first release and would publish v1.0.0. The first release was cut
        # deliberately (TASK-0211) after a one-time `v0.0.0` baseline tag — see
        # docs/process/release.md. Until that tag exists this workflow is a no-op.
        # Runs before Node/npm setup so an unbootstrapped repo doesn't install
        # 400+ packages in this job's only write-privileged run for nothing.
        run: |
          set -euo pipefail
          if [ -n "$(git tag --list 'v*')" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No v* tag yet — the version line is not bootstrapped, so nothing is published. See docs/process/release.md."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.BACKFILL_TAG == '' && steps.bootstrap.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Install pinned release tooling
        if: env.BACKFILL_TAG == '' && steps.bootstrap.outputs.ready == 'true'
        # `npm ci` installs exactly what package-lock.json pins (this is the most
        # privileged job in the repo, so its dependency tree is locked rather
        # than re-resolved per run); --ignore-scripts blocks install scripts.
        run: npm ci --ignore-scripts

      - name: Snapshot existing release tags
        if: env.BACKFILL_TAG == '' && steps.bootstrap.outputs.ready == 'true'
        # semantic-release exposes no "did it release, and what version" job
        # output; diffing the tag list before/after is the cheapest reliable
        # signal, and needs no extra plugin in this job's dependency tree.
        run: git tag --list 'v*' | sort > "$RUNNER_TEMP/tags-before.txt"

      - name: Run semantic-release
        if: env.BACKFILL_TAG == '' && steps.bootstrap.outputs.ready == 'true'
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect what (if anything) was just published
        id: detect
        if: always()
        run: |
          set -euo pipefail

          # `tag`/`version` become `needs.release.outputs.*`, which the assets
          # job interpolates into `run:` blocks and into a sed replacement.
          # Git ref names may legally contain `$`, backticks and parens, so
          # constrain the value to the SemVer charset here — the single point
          # where it originates — instead of trusting every use downstream.
          require_semver_tag() {
            local re='^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'
            if [[ ! "$1" =~ $re ]]; then
              echo "::error::refusing to use '$1': not a v<major>.<minor>.<patch> tag"
              exit 1
            fi
          }

          if [ -n "$BACKFILL_TAG" ]; then
            require_semver_tag "$BACKFILL_TAG"
            if ! git tag --list "$BACKFILL_TAG" | grep -qx "$BACKFILL_TAG"; then
              echo "::error::tag '$BACKFILL_TAG' does not exist in this repository"
              exit 1
            fi
            {
              echo "released=true"
              echo "tag=$BACKFILL_TAG"
              echo "version=${BACKFILL_TAG#v}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ steps.bootstrap.outputs.ready }}" != "true" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag --list 'v*' | sort > "$RUNNER_TEMP/tags-after.txt"
          NEW="$(comm -13 "$RUNNER_TEMP/tags-before.txt" "$RUNNER_TEMP/tags-after.txt")"
          COUNT=0
          if [ -n "$NEW" ]; then
            COUNT="$(printf '%s\n' "$NEW" | grep -c .)"
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          elif [ "$COUNT" -eq 1 ]; then
            require_semver_tag "$NEW"
            {
              echo "released=true"
              echo "tag=$NEW"
              echo "version=${NEW#v}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::error::more than one new v* tag appeared in this run: $NEW"
            exit 1
          fi

  assets:
    name: assets (${{ matrix.target }})
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      # `gh release upload` against the tag the release job just published (or
      # was told to backfill). No other write access is used or needed.
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      # One leg's failure (a runner hiccup, a transient upload error) must not
      # cancel binaries that were building fine for the other three platforms.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel # dated: this label is only guaranteed through Aug 2027
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          # This job never pushes anything via git — uploads go through `gh`
          # with an explicit GH_TOKEN below — so the checkout token is dropped.
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show # reads rust-toolchain.toml; installs the pinned channel + components

      # Deliberately NOT cargo-cached, unlike ci.yml's `rust` job (TASK-0330).
      # Measured 2026-08-01..04 (per-job durations from the Actions API, billed
      # rounded up to the minute, OS multipliers applied):
      #
      #   leg                       runs  avg dur  billed min  floor at 1 min
      #   x86_64-unknown-linux-gnu    12      59s          13              12
      #   aarch64-apple-darwin        12      50s         160             120
      #   x86_64-apple-darwin         12      91s         250             120
      #   x86_64-pc-windows-msvc      12     122s          62              24
      #
      # Two legs already finish inside the one-minute floor, and on the other
      # two the non-build fixed costs alone (checkout, `rustup show` installing
      # the pinned toolchain, packaging, `gh release upload`) plus a cache
      # restore land the job in the same billing minute it occupies today — so
      # the expected saving is roughly zero. Against that: a restored `target`
      # would sit on the path that produces the *published binaries*, and this
      # repository pins every action by SHA and gates on cargo-deny precisely to
      # keep that path auditable. Not a trade worth making for no measured gain.
      # Revisit only with a measured before/after, and even then prefer caching
      # only the checksum-verified parts of CARGO_HOME (never `registry/src`).
      - name: Build and package the release artifact
        # Stamping, `cargo build --release`, the `--version` assertion and
        # packaging/checksumming all live in scripts/build-release-artifact.sh
        # (TASK-0334) — the same script scripts/release-preflight.sh calls for
        # a local rehearsal of this exact leg, so the two cannot drift apart on
        # the part that is expensive to get wrong twice. What stays inline
        # here, deliberately never moved into the shared script: the
        # architecture-mismatch guard (now the script's own first check,
        # unconditional) and the actual publish below, which needs the
        # `GITHUB_TOKEN` this script never sees.
        id: package
        run: |
          set -euo pipefail
          scripts/build-release-artifact.sh \
            "${{ matrix.target }}" \
            "${{ needs.release.outputs.version }}" \
            "${{ needs.release.outputs.tag }}" \
            "${{ matrix.archive }}" \
            "$RUNNER_TEMP"
          echo "dir=$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
          # Read back, not reconstructed: the script itself is the one place
          # that knows the archive's real filename.
          echo "file=$(cat "$RUNNER_TEMP/.artifact-filename")" >> "$GITHUB_OUTPUT"

      - name: Upload the archive and checksum to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "${{ steps.package.outputs.dir }}"
          gh release upload "${{ needs.release.outputs.tag }}" \
            "${{ steps.package.outputs.file }}" \
            "${{ steps.package.outputs.file }}.sha256" \
            --repo "${{ github.repository }}" \
            --clobber
