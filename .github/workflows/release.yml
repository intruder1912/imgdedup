name: Release

# Phase 0 placeholder — manual dispatch only.
#
# Full automated releases (semantic-release computing the SemVer bump, generating
# CHANGELOG/GitHub Release notes, tagging, and attaching binaries) require pushing
# a tag to the protected `main` branch. That needs a release bot / GitHub App or a
# release-as-asset approach, which is tracked as TASK-0203 and wired in Phase 2.
# Until then this workflow does NOT run on push (so it cannot red-flag `main`) and
# only documents intent when dispatched manually.
# See docs/process/release.md and docs/adr/0004-conventional-commits-semver-and-releases.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: release (placeholder)
    runs-on: ubuntu-latest
    steps:
      - name: Explain placeholder status
        run: |
          echo "Release automation is a Phase 0 placeholder."
          echo "semantic-release config lives in .releaserc.json."
          echo "Real publishing is enabled in Phase 2 (TASK-0203), once the"
          echo "protected-main push mechanism is in place."
          echo "See docs/process/release.md and docs/adr/0004-*."
