name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Phase 0 skeleton: dry-run only — computes and reports the would-be release
# WITHOUT writing tags, releases, or commits. Real publishing (and the
# protected-main push mechanism) is wired in Phase 2.
# See docs/process/release.md and docs/adr/0004-*.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run semantic-release (dry-run)
        uses: cycjimmy/semantic-release-action@v6
        with:
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
