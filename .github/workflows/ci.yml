name: CI

on:
  pull_request:
  push:
    branches: [main]

# Minimal default permissions; jobs widen only if needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Lint Markdown
        run: npx -y markdownlint-cli2@0.23.1 "**/*.md"

  spellcheck:
    name: spellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Spell-check docs
        run: npx -y cspell@10.0.1 --no-progress "**/*.md"

  structure:
    name: structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify required repository structure
        run: |
          set -euo pipefail
          required=(
            "CLAUDE.md"
            "README.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "CHANGELOG.md"
            ".claude/agents/product-owner.md"
            ".claude/agents/architect.md"
            ".claude/agents/implementer.md"
            ".claude/agents/tester.md"
            "docs/process/sdlc.md"
            "docs/planning/roadmap.md"
            "docs/planning/backlog.md"
            "docs/planning/status.md"
            "docs/prd/README.md"
            "docs/prd/TEMPLATE.md"
            "docs/adr/README.md"
            "docs/adr/TEMPLATE.md"
            "docs/adr/0001-record-architecture-decisions.md"
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::required file is missing"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Repository structure check failed."
            exit 1
          fi
          echo "Repository structure OK."

  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    # PR-title lint only applies to pull requests (squash uses the title as the
    # commit on main and drives the release).
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title is a Conventional Commit
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
            style
            revert

  linkcheck:
    name: linkcheck (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--config lychee.toml --no-progress './**/*.md'"
          fail: false

  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'build.rs'
              - 'src/**'
              - 'tests/**'
              - '.github/workflows/ci.yml'

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show  # reads rust-toolchain.toml; installs the pinned channel + components

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  ci-gate:
    name: ci-gate
    needs: [changes, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        run: |
          set -euo pipefail
          changes_result="${{ needs.changes.result }}"
          rust_result="${{ needs.rust.result }}"
          echo "changes: $changes_result | rust: $rust_result"
          if [[ "$changes_result" == "failure" || "$changes_result" == "cancelled" ]]; then
            echo "::error::path-filter job did not succeed"; exit 1
          fi
          if [[ "$rust_result" == "failure" || "$rust_result" == "cancelled" ]]; then
            echo "::error::Rust checks failed"; exit 1
          fi
          # success or skipped (docs/chore-only) both pass the gate
          echo "ci-gate passed"
