name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual trigger, added with TASK-0331(a). It is the pre-merge escape hatch
  # for the macOS cadence documented on the `rust` matrix below: macOS no
  # longer runs per PR, so without an on-demand path a macOS-only failure could
  # only ever be reproduced by merging. Costs nothing unless someone asks for
  # it, and only a collaborator with write access can ask.
  #
  # Checked against the release pipeline, since `release.yml` holds the one job
  # in the repository with `contents: write`: a dispatched run of this workflow
  # cannot publish anything. That was originally because `release.yml` triggered
  # on this workflow's completion and required `workflow_run.event == 'push'`;
  # since TASK-0333(b) it is not triggered by this workflow at all (manual
  # dispatch only), and the CI-verification step that replaced that trigger
  # matches the check-run name `ci-gate` exactly — which a dispatched run of
  # this workflow never reports, per (1) below. The property survives the
  # rewrite: a manual CI run can neither publish a release nor satisfy the gate
  # that permits one.
  #
  # Two further properties of this trigger, both handled below rather than left
  # implicit:
  #
  #  1. A dispatched run's check runs land on the *branch head SHA*, i.e. the
  #     same SHA an open PR from that branch is gated on. The `checks` and
  #     `ci-gate` jobs therefore carry a ` (manual)` suffix on this event so a
  #     manual run can neither satisfy nor block a required context (this
  #     workflow's PR-title lint cannot run without a PR context).
  #  2. `concurrency` is keyed on the ref, so dispatching this workflow *on
  #     `main`* while a merge's own CI run is still in flight would cancel it,
  #     leaving that commit with a `cancelled` `ci-gate` — which is exactly what
  #     `release.yml`'s verification step refuses to release from, until CI is
  #     re-run for it. Run this on the branch under test, which is what it is
  #     for; dispatching on `main` reproduces nothing that the push run is not
  #     already running.
  workflow_dispatch:

# Minimal default permissions; jobs widen only if needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job replacing what were previously six separate ubuntu jobs
  # (markdownlint, spellcheck, structure, linkcheck, changes, pr-title) —
  # TASK-0330, CI-minutes optimization. Each of those did 4-15 seconds of real
  # work but paid a full rounded-up-to-the-minute runner minimum plus its own
  # checkout: measured over 2026-08-01..04, those six accounted for 378 of 1790
  # billed minutes (21%), of which ~310 was pure per-job floor rather than work.
  # Consolidating trades a few seconds of wall-clock (the checks now run
  # sequentially) for one job minimum instead of six.
  #
  # Two behaviour changes this forces. Both are deliberate:
  #
  #  1. Every check step below carries `if: ${{ !cancelled() }}`. GitHub skips
  #     the remaining steps of a job once one fails, so without it a single
  #     markdown lint error would hide the other five checks and turn one red
  #     run into up to five sequential red runs — costing far more minutes than
  #     the consolidation saves. With it, a red `checks` still reports every
  #     failing check in one pass, as the six separate jobs did.
  #  2. A job with `needs:` and a plain `if:` still requires that dependency to
  #     have *succeeded* (GitHub ANDs in an implicit `success()`), so a lint
  #     failure here now skips the `rust` matrix, where previously only the
  #     tiny `changes` job could block it. Kept on purpose: that matrix is the
  #     largest line item in the bill, and per (1) nothing is hidden by
  #     deferring it one run.
  #
  # OWNER ACTION REQUIRED — tracked in docs/planning/status.md under
  # "Blockers / waiting on owner". `main`'s branch protection requires the
  # context names `markdownlint`, `spellcheck`, `structure`, `linkcheck` and
  # `pr-title`; none of them exist after this change, so they will sit at
  # "Expected — waiting for status to be reported" on this and every later PR
  # until they are replaced with `checks`. `enforce_admins` is false, so the
  # owner can still merge, but the swap belongs with this PR, not after it.
  # Same manual step TASK-0206 needed for its `linkcheck` rename.
  checks:
    # Suffixed on a manual run — see the `workflow_dispatch` trigger's note at
    # the top of this file. A dispatched run reports its check runs against the
    # branch head SHA, which is the same SHA an open PR from that branch is
    # gated on, so an unsuffixed name would collide with the *required*
    # `checks` context. That collision is unwanted in either direction GitHub
    # might resolve it: this job's PR-title lint cannot run without a PR
    # context (it is skipped), so a manual run must never be able to report the
    # context that gate hides behind — nor to block a PR that is otherwise
    # green. A suffixed name is inert to branch protection and reads clearly in
    # the Actions UI.
    name: checks${{ github.event_name == 'workflow_dispatch' && ' (manual)' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    env:
      TYPOS_VERSION: "1.48.0"
      # sha256 of typos-v1.48.0-x86_64-unknown-linux-musl.tar.gz, computed and
      # pinned by hand (crate-ci/typos publishes no checksums file to verify
      # against) — the third-party `crate-ci/typos` GitHub Action was tried
      # and rejected: its entrypoint builds a glob with plain bash (no
      # `shopt -s globstar`), so a `**` pattern silently fails to recurse and
      # would have under-checked everything below the top level.
      TYPOS_SHA256: "72a930c9a94fc3914aa56835c5b859c892a797d40c1c42638b98d93f16ff519c"
      SHELLCHECK_VERSION: "0.11.0"
      # sha256 of shellcheck-v0.11.0.linux.x86_64.tar.xz, computed and pinned
      # by hand — same reasoning as TYPOS_SHA256: upstream publishes no
      # separate checksums file for this release to verify against instead.
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      ACTIONLINT_VERSION: "1.7.12"
      # sha256 of actionlint_1.7.12_linux_amd64.tar.gz, checked against
      # upstream's own published actionlint_1.7.12_checksums.txt and pinned
      # here by hand rather than trusted at fetch time — an attacker who could
      # tamper with one release asset in transit could tamper with the
      # checksums file alongside it, so re-fetching and re-checking it on
      # every run would verify nothing this fixed value doesn't already.
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First, and before anything that can fail: `rust` gates on this job's
      # `code` output, so it has to be produced even when a later check here
      # goes red — an unset output would silently read as "no code changed".
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'build.rs'
              - 'src/**'
              - 'tests/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
      - name: Lint Markdown
        if: ${{ !cancelled() }}
        run: npx -y markdownlint-cli2@0.23.1 "**/*.md"

      - name: Install pinned typos
        id: install-typos
        if: ${{ !cancelled() }}
        # Downloaded and unpacked in RUNNER_TEMP, not the workspace: this job is
        # now shared with checks that glob the working tree, and a stray tarball
        # and binary at the repo root are theirs to trip over.
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sfLO "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${TYPOS_SHA256}  typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c
          tar -xzf "typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" ./typos
          install -m 755 ./typos /usr/local/bin/typos
      - name: Spell-check docs
        # Skipped, not failed, when the install above did not succeed: the job
        # is already red in that case and `typos: command not found` would only
        # bury the real error.
        if: ${{ !cancelled() && steps.install-typos.outcome == 'success' }}
        run: |
          # Word splitting is the point: typos takes one filename per
          # argument, and every tracked path here is plain ASCII with no
          # spaces or glob metacharacters.
          # shellcheck disable=SC2046
          typos $(git ls-files '*.md')

      - name: Verify required repository structure
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          required=(
            "CLAUDE.md"
            "README.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "CHANGELOG.md"
            "LICENSE"
            ".claude/agents/product-owner.md"
            ".claude/agents/architect.md"
            ".claude/agents/implementer.md"
            ".claude/agents/tester.md"
            "docs/process/sdlc.md"
            "docs/planning/roadmap.md"
            "docs/planning/backlog.md"
            "docs/planning/status.md"
            "docs/prd/README.md"
            "docs/prd/TEMPLATE.md"
            "docs/adr/README.md"
            "docs/adr/TEMPLATE.md"
            "docs/adr/0001-record-architecture-decisions.md"
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::required file is missing"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Repository structure check failed."
            exit 1
          fi
          echo "Repository structure OK."

      - name: Check links
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--config lychee.toml --no-progress './**/*.md'"
          fail: true

      # TASK-0335: neither shellcheck nor actionlint was gated anywhere before
      # this — every finding either tool has ever caught in this repository,
      # including a real command-injection defect found during TASK-0334's
      # review, was caught by a human running them by hand. installed the same
      # way as typos above: downloaded into RUNNER_TEMP, checksum-verified
      # against a hand-pinned value, installed to /usr/local/bin.
      - name: Install pinned shellcheck
        id: install-shellcheck
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sfLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | sha256sum -c
          tar -xJf "shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          install -m 755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
      - name: Lint shell scripts
        if: ${{ !cancelled() && steps.install-shellcheck.outcome == 'success' }}
        run: |
          # Tracked files, not a scripts/*.sh glob: a script added below the
          # top level of scripts/ (e.g. scripts/release-preflight/ already
          # exists as a directory) would otherwise go unlinted with no signal.
          # shellcheck disable=SC2046
          shellcheck $(git ls-files '*.sh')

      - name: Install pinned actionlint
        id: install-actionlint
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sfLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum -c
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          install -m 755 actionlint /usr/local/bin/actionlint
      - name: Lint GitHub Actions workflows
        # actionlint runs shellcheck on every embedded `run:` script too, as
        # long as a `shellcheck` binary is on PATH — which the step above just
        # put there, so this also re-covers every workflow's inline shell with
        # no separate invocation. That coupling is silent if it ever breaks:
        # actionlint with no shellcheck on PATH just skips the embedded-shell
        # rule rather than failing, so it's asserted explicitly here instead
        # of trusted.
        if: ${{ !cancelled() && steps.install-actionlint.outcome == 'success' }}
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || { echo "::error::actionlint needs shellcheck on PATH to lint embedded shell"; exit 1; }
          actionlint

      # PR-title lint only applies to pull requests (squash uses the title as
      # the commit on main and drives the release).
      - name: Validate PR title is a Conventional Commit
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
            style
            revert

  rust:
    name: rust (${{ matrix.os }})
    needs: checks
    # A manual run is an explicit request for this matrix, so it is honoured
    # regardless of what the paths filter says changed (the filter's non-PR
    # semantics — diff against the default branch — would otherwise decide it).
    if: needs.checks.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # TASK-0330 / TASK-0331(a) (CI-minutes optimization). Measured
      # 2026-08-01..04 from the Actions API (per-job durations, billed rounded
      # up to the whole minute per job, with GitHub's OS multipliers — Linux
      # 1x, Windows 2x, macOS 10x):
      #
      #   leg               runs  avg dur  billed min  floor at 1 min/run
      #   ubuntu-latest       32      68s          60                  32
      #   windows-latest      32     148s         190                  64
      #   macos-latest        32      53s         390                 320
      #
      # macOS alone was 22% of the repository's entire Actions bill (390 of
      # ~1790 billed minutes over those four days) for the leg that finishes
      # *fastest*: 320 of its 390 minutes are the one-minute per-job floor
      # multiplied by 10. Nothing about how that job runs can reach that number
      # — TASK-0330 measured that caching it makes it worse, since restoring a
      # several-hundred-megabyte `target` pushes a 53s job past 60s and doubles
      # the bill (see the cache step below). The only remaining lever is how
      # *often* it runs.
      #
      # Owner ruling (2026-08-05): macOS runs on `push: main` only, not per PR.
      # ubuntu and windows are unchanged and still run on every PR commit.
      # Dropping ~24 of macOS's 32 runs is worth an estimated −250 to −300
      # billed minutes per four days — the single largest lever available, and
      # larger than everything TASK-0330 shipped put together.
      #
      # The trade, stated plainly: a macOS-only regression is now found after
      # the merge that introduced it, on `main`, rather than on the PR that
      # introduced it. Accepted because this leg mostly duplicates the Linux
      # leg's coverage — the one macOS-specific behaviour, trash
      # recoverability, is *not* asserted there anyway (see
      # IMGDEDUP_REQUIRE_TRASH_CHECK below, an older and orthogonal exemption)
      # — and because a red `main` is loud rather than silent. The workflow's
      # `workflow_dispatch` trigger keeps a pre-merge path open: run this
      # workflow manually on a branch for the full three-OS matrix on demand,
      # i.e. one deliberate 10x run instead of 32 automatic ones.
      #
      # Mechanism note: this varies the matrix *width* rather than adding a
      # separate macOS job with a job-level `if:`. `rust` therefore remains
      # exactly one job with one result, so `ci-gate`'s `needs.rust.result`
      # check is unaffected and needs no new skip case. A `rust-macos` job
      # would instead report `skipped` on every PR and add a third `needs:`
      # entry whose `skipped` result `ci-gate` would have to distinguish from a
      # real one — the same class of `needs:`/`if:`/skip interaction the
      # `checks` job's header already warns about.
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    permissions:
      contents: read
    env:
      # Incremental artifacts are ~1 GB of a debug `target` here and are worth
      # nothing to a fresh runner. Turning them off keeps the cache below well
      # inside the repository's 10 GB Actions-cache budget and makes these
      # single-shot builds marginally faster.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show  # reads rust-toolchain.toml; installs the pinned channel + components

      # TASK-0330 (CI-minutes optimization). Against the measurement tabulated
      # above, macOS is the most expensive job in the repository and yet the
      # *least* worth caching: it already finishes inside the one-minute
      # billing floor, so at most 70 of its 390 minutes were ever recoverable,
      # while restoring and unpacking a several-hundred-megabyte `target` on a
      # macOS runner would push a 53-second job past 60 seconds and double the
      # bill instead. The cache is therefore applied only where there is
      # headroom above the floor. This exclusion is now doubly moot on PRs,
      # where TASK-0331(a) removed the macOS leg outright, but it still governs
      # the `push: main` runs where it does execute. Revisit it if the macOS
      # leg's own build time grows past ~60s. A single `runner.os`-keyed cache
      # is unambiguous here: this matrix builds exactly one architecture per
      # OS.
      - name: Cache cargo registry and build artifacts
        if: runner.os != 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Only the checksum-verified parts of CARGO_HOME. Cargo verifies a
          # `.crate` archive against Cargo.lock's checksum when it unpacks it,
          # but never re-verifies an already-unpacked `registry/src`, so caching
          # `src` would place unverifiable sources on the build path — and it is
          # the bulkiest part of the directory, regenerable from `cache/`.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # A toolchain bump or any dependency change invalidates the entry;
          # the restore-key prefix still gives a warm start from the previous
          # dependency set, which cargo reconciles per crate.
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
        env:
          # AC-3 proves a trashed file is recoverable via the platform trash
          # listing, which the `trash` crate supports only on Linux and
          # Windows. On macOS the check is skipped, and a mutation that turned
          # trashing into permanent deletion was shown to pass there. On the
          # platforms that *can* check, a failure to enumerate the trash must
          # be fatal rather than a printed note — otherwise every job could
          # silently degrade to no coverage at all and nobody would learn that
          # the defect class is uncovered.
          IMGDEDUP_REQUIRE_TRASH_CHECK: ${{ runner.os != 'macOS' && '1' || '' }}

  ci-gate:
    # Suffixed on a manual run for the same reason as `checks` above: this is
    # the aggregating *required* context, and a dispatched run must not be able
    # to report it for a PR head SHA.
    name: ci-gate${{ github.event_name == 'workflow_dispatch' && ' (manual)' || '' }}
    needs: [checks, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        run: |
          set -euo pipefail
          checks_result="${{ needs.checks.result }}"
          rust_result="${{ needs.rust.result }}"
          echo "checks: $checks_result | rust: $rust_result"
          if [[ "$checks_result" == "failure" || "$checks_result" == "cancelled" ]]; then
            echo "::error::checks job did not succeed"; exit 1
          fi
          if [[ "$rust_result" == "failure" || "$rust_result" == "cancelled" ]]; then
            echo "::error::Rust checks failed"; exit 1
          fi
          # success or skipped (docs/chore-only) both pass the gate
          echo "ci-gate passed"
